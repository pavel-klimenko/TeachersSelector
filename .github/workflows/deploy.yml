name: BuildAndDeploy

on: [push]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Installing Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Checking architecture rules (Deptrac)
        run: composer deptrac

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checking connection with production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          password: ${{ secrets.PRODUCTION_SERVER_PASSWORD }}
          port: 22
          script: whoami

  deploy:
    needs: [check, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update and rebuild project on the production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          password: ${{ secrets.PRODUCTION_SERVER_PASSWORD }}
          port: 22
          script: |
            cd ~/TeachersSelector
            echo "📥 Pulling latest code..."
            git pull

            echo "📦 Installing Composer dependencies..."
            composer install --no-interaction --prefer-dist

            echo "⚙️ Updating database schema..."
            php bin/console doctrine:migrations:migrate

            echo "🧪 Running PHPUnit tests..."
            php bin/phpunit --testdox --colors=always