apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ts.fullname" . }}-web
  labels: {{- include "ts.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  # выкатка без простоя: новый под должен стать Ready, прежде чем старый будет остановлен
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "ts.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ts.selector" (dict "root" . "component" "web") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "ts.pullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: fpm-config
          configMap:
            name: {{ include "ts.fullname" . }}-fpm
      containers:
        - name: nginx
          image: {{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # readiness идёт через fpm и Symfony (/health-check), liveness - только nginx
          readinessProbe:
            httpGet: { path: /health-check, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # пауза перед остановкой: балансировщик успевает убрать под из endpoints
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          {{- with .Values.web.resources.nginx }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: php-fpm
          image: {{ include "ts.phpImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: {{- include "ts.envFrom" . | nindent 12 }}
          ports:
            - name: fpm
              containerPort: 9000
          volumeMounts:
            - name: fpm-config
              mountPath: /usr/local/etc/php-fpm.d/zz-tuning.conf
              subPath: zz-tuning.conf
          # медленный старт (холодный OPcache) не должен убивать под liveness-пробой
          startupProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
          {{- with .Values.web.resources.php }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ts.fullname" . }}-web
  labels: {{- include "ts.labels" . | nindent 4 }}
spec:
  selector: {{- include "ts.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ts.fullname" . }}-web
  labels: {{- include "ts.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ts.fullname" . }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ts.fullname" . }}-web
  labels: {{- include "ts.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "ts.selector" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}
