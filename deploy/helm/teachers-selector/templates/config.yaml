apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ts.fullname" . }}
  labels: {{- include "ts.labels" . | nindent 4 }}
data:
  # chat-ws обращается к приложению по HTTP через Service web
  CHAT_SERVER_HOST: {{ printf "%s-web" (include "ts.fullname" .) | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ts.fullname" . }}
  labels: {{- include "ts.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := omit .Values.secrets "existingSecret" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
