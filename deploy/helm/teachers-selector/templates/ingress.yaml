{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ts.fullname" . }}
  labels: {{- include "ts.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ts.fullname" . }}-web
                port: { name: http }
    {{- if and .Values.chat.enabled .Values.ingress.chatHost }}
    - host: {{ .Values.ingress.chatHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ts.fullname" . }}-chat
                port: { name: ws }
    {{- end }}
{{- end }}
