apiVersion: 1

# Источник данных создаётся автоматически при старте Grafana.
# Параметры подключения берутся из переменных окружения контейнера (см. docker-compose.yaml).
datasources:
  - name: TeachersSelector PostgreSQL
    uid: teachers-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: pgsql:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1300
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
