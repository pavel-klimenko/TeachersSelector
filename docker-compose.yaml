version: '3'
services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Nginx.Dockerfile
    image: balance/nginx
    container_name: balancer-nginx
    ports:
      - "8096:80"
    networks:
      - internal
    volumes:
      - ./:/var/www/app
  fpm1:
    build:
      context: .
      dockerfile: ./docker/php/Fpm.Dockerfile
    image: balance/php
    container_name: fpm1
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/app
      - ./docker/php/conf.d/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
#      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    networks:
      - internal
#    environment:
#      PHP_IDE_CONFIG: teachers.selector.local
#      XDEBUG_MODE: debug
#      XDEBUG_CONFIG: client_host=host.docker.internal
#      XDEBUG_TRIGGER: 'yes'
  fpm2:
    build:
      context: .
      dockerfile: ./docker/php/Fpm.Dockerfile
    image: balance/php
    container_name: fpm2
    ports:
      - "8081:8081"
    volumes:
      - ./:/var/www/app
      - ./docker/php/conf.d/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
      - ./docker/php/conf.d/swoole.ini:/usr/local/etc/php/conf.d/swoole.ini
#      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    networks:
      - internal
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # используются в provisioning/datasources/postgres.yml
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - internal

###> doctrine/doctrine-bundle ###
  pgsql:
    build:
      context: .
      dockerfile: ./docker/db/Db.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '5496:5432'
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', '${POSTGRES_DB}', '-U', '${POSTGRES_USER}']
      timeout: 5s
      retries: 5
      #start_period: 60s
    volumes:
      - pgsql_data:/var/lib/postgresql/data:rw

networks:
  internal:

volumes:
###> doctrine/doctrine-bundle ###
  pgsql_data:
###< doctrine/doctrine-bundle ###
  grafana_data:
